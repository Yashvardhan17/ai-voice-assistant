services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
  ui:
    build: .
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - BACKEND_URL=http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
